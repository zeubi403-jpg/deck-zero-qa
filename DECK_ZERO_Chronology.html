<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deck Zero · Century spine</title>
<meta name="description" content="Century spine inside the Cairn-9 dossier — open after the knives, not as the front door.">
<meta property="og:title" content="Deck Zero · Century spine">
<meta property="og:description" content="Century spine inside the Ashen-Null optical dossier. Knives first.">
<meta name="theme-color" content="#020805">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--void:#020805;--phos:#4dff9a;--ink:#c5ddd0;--muted:#8aab9a;--mono:"IBM Plex Mono",monospace;--serif:"Instrument Serif",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(180deg,#030906,#07140f);color:var(--ink);font-family:var(--serif);padding:clamp(1.2rem,4vw,2rem)}
.kicker{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--phos);margin-bottom:.75rem}
h1{font-family:var(--mono);font-size:clamp(1.4rem,4vw,2rem);color:#eefaf3;text-transform:uppercase;margin-bottom:.85rem}
p{font-size:1.08rem;line-height:1.55;color:var(--muted);max-width:36rem;margin-bottom:1.25rem}
.row{display:flex;flex-wrap:wrap;gap:.65rem}
a,button{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;padding:.7rem .9rem;border:1px solid rgba(77,255,154,.35);
  color:var(--phos);background:transparent;cursor:pointer;min-height:44px;display:inline-flex;align-items:center
}
a.primary,button.primary{background:var(--phos);color:var(--void);border-color:var(--phos)}
.muted{color:#6f9180;font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;margin-top:1.5rem}
</style>
</head>
<body>
  <div class="kicker">Ashen-Null · century spine</div>
  <h1 data-lang-switch>Century spine</h1>
  <p data-lang-switch-p>This is the long historical section inside the Cairn-9 dossier — not the front door. Start with the novel or the warm-hull knives if you have not yet.</p>
  <div class="row">
    <a class="primary" id="go" href="DECK_ZERO_Pitch.html#9">Open timeline in Brief</a>
    <a href="index.html" id="home">Home</a>
    <a href="ARCHIVES_Silent_Running.html" id="novel">Novel</a>
    <a href="DECK_ZERO_Pitch.html" id="brief">Brief (start)</a>
  </div>
  <div class="muted">Faraday seal · fiber only · no RF</div>
<script src="dz-terminal.js"></script>
<script>
(function () {
  var lang = "en";
  try {
    var q = new URLSearchParams(location.search).get("lang");
    var s = localStorage.getItem("dz_lang") || localStorage.getItem("dz-lang");
    lang = q === "fr" || q === "en" ? q : (s === "fr" ? "fr" : "en");
  } catch (e) {}
  document.documentElement.lang = lang;
  try {
    localStorage.setItem("dz_lang", lang);
    localStorage.setItem("dz-lang", lang);
  } catch (e) {}
  var go = document.getElementById("go");
  var home = document.getElementById("home");
  var novel = document.getElementById("novel");
  var brief = document.getElementById("brief");
  var q = "?lang=" + lang;
  go.href = "DECK_ZERO_Pitch.html" + q + "#9";
  home.href = "index.html" + q;
  novel.href = "ARCHIVES_Silent_Running.html" + q;
  brief.href = "DECK_ZERO_Pitch.html" + q;
  var h = document.querySelector("[data-lang-switch]");
  var p = document.querySelector("[data-lang-switch-p]");
  if (h) h.textContent = lang === "fr" ? "Axe du siècle" : "Century spine";
  if (p) {
    p.textContent = lang === "fr"
      ? "Section historique longue à l’intérieur du dossier Cairn-9 — pas la porte d’entrée. Commencez par le roman ou les lames si vous n’y êtes pas encore."
      : "This is the long historical section inside the Cairn-9 dossier — not the front door. Start with the novel or the warm-hull knives if you have not yet.";
  }
  document.title = lang === "fr" ? "Deck Zero · Axe du siècle" : "Deck Zero · Century spine";
  go.textContent = lang === "fr" ? "Ouvrir l’axe dans le dossier" : "Open spine in dossier";
})();
</script>
</body>
</html>
