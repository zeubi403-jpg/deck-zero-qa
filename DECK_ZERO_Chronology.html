<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deck Zero · Century log</title>
<meta name="theme-color" content="#020805">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="DECK_ZERO_Pitch.html#9">
<meta property="og:title" content="Deck Zero · Century appendix">
<meta property="og:description" content="Optional century appendix — Ashen-Null optical dossier. Knives first.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="og.png">
<style>
:root{
  --void:#020805;--ink:#a8c4b4;--title:#d4f0e0;--phos:#4dff9a;--phos-dim:#2a8f58;
  --line:rgba(77,255,154,.18);--mono:"IBM Plex Mono",ui-monospace,monospace;
  --frame:clamp(14px,2.4vw,22px);--radius-tube:clamp(14px,3.2vw,28px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--void);color:var(--ink);font-family:Georgia,serif}
body{
  background:
    radial-gradient(ellipse 55% 40% at 50% 0%, rgba(77,255,154,.09), transparent 55%),
    linear-gradient(180deg,#030906,#07140f);
  display:flex;align-items:center;justify-content:center;
  padding:calc(var(--frame) + 1.5rem);
}
.bezel{
  position:fixed;inset:0;pointer-events:none;
  border-radius:var(--radius-tube);
  box-shadow:
    inset 0 0 0 1px rgba(77,255,154,.2),
    inset 0 0 0 var(--frame) #010403,
    inset 0 0 0 calc(var(--frame) + 1px) rgba(77,255,154,.1);
}
.card{
  position:relative;z-index:1;width:min(28rem,100%);
  border:1px solid var(--line);background:rgba(2,8,5,.92);
  padding:1.35rem 1.4rem;border-radius:10px;
}
.kicker{
  font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--phos-dim);margin-bottom:.7rem;
}
h1{
  font-family:var(--mono);font-weight:500;font-size:1.25rem;letter-spacing:.04em;
  text-transform:uppercase;color:var(--title);margin-bottom:.75rem;
}
p{line-height:1.55;margin-bottom:1.1rem;max-width:32rem}
.links{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center}
a{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--phos);text-decoration:none;border:1px solid var(--line);
  padding:.55rem .75rem;min-height:44px;display:inline-flex;align-items:center;
  background:rgba(4,14,10,.75);
}
a.primary{background:rgba(77,255,154,.12);border-color:rgba(77,255,154,.4)}
a:hover{background:rgba(77,255,154,.18);text-decoration:none}
.muted{color:#6f9180;font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;margin-top:1rem}
</style>
<script>
(function () {
  var lang = "en";
  try { lang = localStorage.getItem("dz-lang") || lang; } catch (e) {}
  var q = new URLSearchParams(location.search).get("lang");
  if (q === "fr" || q === "en") lang = q;
  var target = "DECK_ZERO_Pitch.html?lang=" + lang + "#8";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) {
    setTimeout(function () { location.replace(target); }, 700);
  }
  window.__dzCenturyTarget = target;
})();
</script>
<script src="dz-terminal.js"></script>
</head>
<body>
<div class="bezel" aria-hidden="true"></div>
<main class="card">
  <div class="kicker">Ashen-Null · appendix only</div>
  <h1 data-lang-switch>Century appendix</h1>
  <p data-lang-switch-p>Routing to the optional century appendix. Knives come first in the main log.</p>
  <div class="links">
    <a class="primary" id="go" href="DECK_ZERO_Pitch.html#9">Open appendix 09</a>
    <a id="home" href="index.html">Terminal</a>
  </div>
  <div class="muted">Faraday seal · fiber only · no RF</div>
</main>
<script>
(function () {
  var lang = "en";
  try { lang = localStorage.getItem("dz-lang") || lang; } catch (e) {}
  var q = new URLSearchParams(location.search).get("lang");
  if (q === "fr" || q === "en") lang = q;
  document.documentElement.lang = lang;
  var target = window.__dzCenturyTarget || ("DECK_ZERO_Pitch.html?lang=" + lang + "#9");
  var go = document.getElementById("go");
  var home = document.getElementById("home");
  if (go) {
    go.href = target;
    go.textContent = lang === "fr" ? "Ouvrir annexe 09" : "Open appendix 09";
  }
  if (home) home.href = "index.html?lang=" + lang;
  var h = document.querySelector("[data-lang-switch]");
  var p = document.querySelector("[data-lang-switch-p]");
  if (h) h.textContent = lang === "fr" ? "Annexe du siècle" : "Century appendix";
  if (p) {
    p.textContent = lang === "fr"
      ? "Routage vers l’annexe siècle (optionnelle). Les lames viennent d’abord."
      : "Routing to the optional century appendix. Knives come first in the main log.";
  }
  document.title = lang === "fr" ? "Deck Zero · Annexe du siècle" : "Deck Zero · Century appendix";
})();
</script>
</body>
</html>
